<!DOCTYPE html>
<head>
    <title>Realtime Whiteboard</title> 
    <link rel="stylesheet" href="./css/style.css">
</head>
<body> 

    <div id="joinScreen" class="join-screen">
        <div class="join-card">
            <h2>Join Whiteboard</h2>
            <input id="usernameInput" placeholder="Your Name">
            <input id="roomInput" placeholder="Room Name">

            <button id="joinRoomBtn">Join Room</button>
        </div>
    </div>

    <div class="toolBar">
        <input type="color" id="colorPicker">
        <input type="range" id="brushSize" min="1" max="50" value="5">
        <button id="brushTool">Brush</button>
        <button id="eraserTool">Eraser</button>
        <button id="clearBoard">Clear</button>
        <button id="undoBtn">Undo</button>
        <button id="redoBtn">Redo</button>
        <button id="rectTool">Rectangle</button>
        <button id="lineTool">Line</button>
        <button id="circleTool">Circle</button>
        <button id="arrowTool">Arrow</button>
    </div>

    <canvas id="board"></canvas> 
    
    <div id="cursorsContainer"></div>

    <div class="chat">
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
            <input id="chatInput" placeholder="Message...">
            <button type="submit">Send</button>
        </form>
    </div>

    <div class="users-panel">
        <div class="users-header">
            Online users
        </div>
        <div id="usersList"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script> 
    <script type="module" src="./js/app.js"></script>

</body>
